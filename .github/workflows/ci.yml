name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: npm test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Extension host test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host
      - name: Package
        run: npm run package
