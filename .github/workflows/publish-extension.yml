name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: |
          package_version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Extension host test
        run: xvfb-run -a npm run test:host
      - run: npx @vscode/vsce publish --oidc
